<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museu AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- Estilo básico -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      text-align: center;
    }

    #enter-ar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #111;
      border: 2px solid white;
      color: white;
      font-size: 16px;
      cursor: pointer;
      z-index: 999;
    }

    a-scene {
      display: none;
    }
  </style>
</head>
<body>

  <button id="enter-ar">Entrar em AR</button>

  <a-scene
    id="ar-scene"
    embedded
    renderer="colorManagement: true;"
    xr-mode-ui="enabled: false"
    webxr="optionalFeatures: hit-test, local-floor;">

    <!-- Luz -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="2 4 2" intensity="0.6"></a-light>

    <!-- Câmera -->
    <a-camera position="0 1.6 0"></a-camera>

    <!-- Portal Container -->
    <a-entity id="portal-container"></a-entity>

  </a-scene>

  <script src="js/main.js"></script>
  <script src="js/portal-engine.js"></script>

</body>
</html>
