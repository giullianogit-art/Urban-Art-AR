<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>TotemAR - AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/app.js"></script>
</head>

<body class="ar-page">

  <!-- UI Overlay -->
  <div class="ui-overlay hidden" id="uiPanel">
    <div class="info-box">
      <h2>Nome da Obra</h2>
      <p>Artista</p>

      <div class="buttons">
        <button onclick="openVideo()">🎥 Vídeo</button>
        <button onclick="openInfo()">ℹ️ Sobre</button>
        <button onclick="enterGallery()">🌐 Galeria</button>
      </div>
    </div>
  </div>

  <!-- Cena AR -->
  <a-scene
    renderer="antialias: true; alpha: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <a-asset-item id="model" src="assets/models/Boneca27.glb"></a-asset-item>
    </a-assets>

    <a-marker
      type="pattern"
      url="assets/markers/pattern-hiro.patt"
      id="marker"
    >

      <!-- Base -->
      <!-- TOTEM FUTURISTA -->

<!-- Base principal -->
<a-cylinder 
  position="0 0.4 0"
  radius="0.45"
  height="0.8"
  color="#0F0F12"
  metalness="0.8"
  roughness="0.2">
</a-cylinder>

<!-- Anel luminoso inferior -->
<a-torus
  position="0 0.05 0"
  radius="0.5"
  radius-tubular="0.02"
  rotation="90 0 0"
  material="color: #00D4FF; emissive: #00D4FF; emissiveIntensity: 1">
</a-torus>

<!-- Coluna central -->
<a-cylinder
  position="0 1 0"
  radius="0.15"
  height="1.2"
  color="#1A1A22">
</a-cylinder>

<!-- Plataforma superior -->
<a-cylinder
  position="0 1.65 0"
  radius="0.35"
  height="0.1"
  color="#00D4FF"
  emissive="#00D4FF"
  emissiveIntensity="0.6">
</a-cylinder>


      <!-- Modelo -->
      <a-entity
        gltf-model="#model"
        position="0 1.85 0"
        scale="0.5 0.5 0.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 12000"
      ></a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
